<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HA 指令助手 · 日志</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="mark">HA</div>
          <div>
            <h1>运行日志</h1>
            <p>只显示本插件产生的日志，保留最近 400 条</p>
          </div>
        </div>
        <div class="top-actions">
          <span class="chip" id="count">0 / 400</span>
          <button type="button" id="refresh">刷新</button>
          <label class="check">
            <input type="checkbox" id="auto" checked />
            <span>自动刷新</span>
          </label>
          <button type="button" id="clear">清空</button>
        </div>
      </header>

      <div class="toolbar">
        <label class="field">
          <span>最低级别</span>
          <select id="level">
            <option value="DEBUG">全部</option>
            <option value="INFO" selected>INFO 及以上</option>
            <option value="WARNING">WARNING 及以上</option>
            <option value="ERROR">ERROR 及以上</option>
          </select>
        </label>
        <span class="status" id="status"></span>
      </div>

      <p class="banner" id="banner" hidden></p>

      <div class="logbox" id="list"></div>
      <p class="empty" id="empty">暂无日志。</p>

      <footer class="foot">
        日志同时写入 AstrBot 日志文件；这里只是内存缓冲，重载插件后会清空。
      </footer>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
