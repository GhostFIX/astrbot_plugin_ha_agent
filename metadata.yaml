name: astrbot_plugin_ha_agent
display_name: HA 指令助手
short_desc: 把 /ha 后面的文字原样发到 Home Assistant，并把 HA 告警推回聊天；REST 与 MQTT 双向可选。
desc: |
  把 AstrBot 当作 Home Assistant 的纯文本输入输出端口，不依赖任何大模型。

  **AstrBot → HA**：聊天里发 `/ha 开电脑`，插件把 `开电脑` 三个字原样作为
  `command` 字段送出去。两种方式任选：

  - REST：`POST /api/events/astrbot_command`，HA 用事件触发器监听；
  - MQTT：发布到 `astrbot/ha/command`，HA 用 `mqtt` 触发器监听。

  重复发送同一条命令每次都会送达，不做去重。

  **HA → AstrBot**：两种方式任选。

  - HTTP：插件内置带令牌校验的监听（默认 `/ha/notify`），HA 用 `rest_command`；
  - MQTT：插件订阅 `astrbot/ha/notify`，HA 用 `mqtt.publish`。

  收到的文字转发到配置里指定的会话；告警目标留空则完全不接收。

  Docker 部署且不想多映射端口时，两个方向都选 MQTT 即可——全部是出站连接。

  适合"温度超过 30°C 提醒我""指令触发家庭自动化""把 HA 告警转进群里"这类
  轻量场景。

  插件自带可视化设置页：切换 REST/MQTT 后只显示相关配置项，保存即热生效；
  原生配置页保留全部选项备查。
version: 1.2.6
author: deepseek-flash (GhostFIX)
repo: https://github.com/GhostFIX/astrbot_plugin_ha_agent
astrbot_version: ">=4.5.0"
tags:
  - home-assistant
  - mqtt
  - iot
  - automation
